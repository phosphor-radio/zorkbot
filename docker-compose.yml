services:
  game:
    build: ./game
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./data/saves:/data
      - ./games/zork1.z3:/game/zork1.z3:ro
    environment:
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-8}
      SESSION_IDLE_START_SECONDS: ${SESSION_IDLE_START_SECONDS:-300}
      SESSION_INACTIVITY_SECONDS: ${SESSION_INACTIVITY_SECONDS:-1800}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zorkbot:
    build: ./zorkbot
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    devices:
      - ${MESHCORE_DEVICE:-/dev/meshcore}:${MESHCORE_CONTAINER_DEVICE:-/dev/meshcore}
    group_add:
      - ${MESHCORE_GROUP_GID:-20}
    volumes:
      - ${ZORKBOT_CONFIG:-./zorkbot/zorkbot.toml}:/app/zorkbot.toml:ro
      - ./data/admin:/data
    ports:
      - "${ADMIN_UI_PORT:-8081}:${ADMIN_UI_PORT:-8081}"
    environment:
      GAME_URL: ${GAME_URL:-http://game:8080}
      # These must default to EMPTY, not to a literal value. config.py treats any
      # non-empty string as an override, so a default of "false" here would clobber
      # [admin_ui] in zorkbot.toml and make that section impossible to use. Empty
      # means "unset", and the TOML value wins.
      ADMIN_UI_ENABLED: ${ADMIN_UI_ENABLED:-}
      ADMIN_UI_BIND: ${ADMIN_UI_BIND:-}
      ADMIN_UI_PORT: ${ADMIN_UI_PORT:-}
      ADMIN_UI_DB: ${ADMIN_UI_DB:-}
    command:
      - --serial
      - ${MESHCORE_CONTAINER_DEVICE:-/dev/meshcore}
      - --config
      - /app/zorkbot.toml
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[z]orkbot' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
