name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: game/go.mod
          cache-dependency-path: game/go.sum

      - name: Verify module
        run: go mod verify

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /dev/null ./cmd/zorkd
