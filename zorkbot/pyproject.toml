[project]
name = "zorkbot"
version = "0.1.0"
description = "MeshCore radio bot for shared Zork I"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "meshcore>=2.3",
]

[project.scripts]
zorkbot = "zorkbot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zorkbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
